name: Reproduction preflight (no dataset/GPU)
on:
  push:
    branches:
      - "repro/**"
  pull_request:

jobs:
  syntax-and-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile Python sources
        run: python -m compileall -q train.py dataloader.py model.py model_graph.py gcn.py utils.py scripts/check_data.py tests
      - name: Test dataset preflight
        run: python -m unittest discover -s tests -v
